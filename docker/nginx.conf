server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las peticiones a la API se redirigen al contenedor backend en la red compartida.
    # proxy_pass no lleva barra final para conservar el prefijo /api.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Fallback de SPA: deja que React Router maneje las rutas del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Endpoint ligero para comprobaciones del contenedor y del balanceador de carga.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
